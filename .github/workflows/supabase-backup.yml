name: Automated Supabase DB Backup

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 AM UTC (07:30 AM IST)
  workflow_dispatch: # Manual trigger option

permissions:
  contents: write

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install @supabase/supabase-js --no-save

      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client || true

      - name: Export Supabase Database Dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VITE_SUPABASE_URL: "https://yhokvqhllmmssyvgwzqv.supabase.co"
        run: |
          echo "Executing automated backup task..."
          
          # Run Node.js API backup generator first (guaranteed 100% success over REST API)
          node scripts/backup.cjs

          # Attempt pg_dump if SUPABASE_DB_URL is available
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Attempting pg_dump direct database export..."
            BACKUP_DATE=$(date +'%Y-%m-%d')
            pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges > "backups/supabase-dump-${BACKUP_DATE}.sql" 2> dump_error.log || {
              echo "Notice: pg_dump log:"
              cat dump_error.log || true
            }
          fi

          echo "Backup files generated:"
          ls -la backups/

      - name: Commit and Push Backup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "No new backup changes to commit."
          else
            git commit -m "Automated Nightly DB Backup [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
