name: Automated Supabase DB Backup

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 AM UTC
  workflow_dispatch: # Manual trigger option

permissions:
  contents: write

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client

      - name: Create Backups Directory
        run: mkdir -p backups

      - name: Export Supabase Database Dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set in Repository Settings -> Secrets and variables -> Actions!"
            exit 1
          fi

          BACKUP_DATE=$(date +'%Y-%m-%d')
          BACKUP_FILE="backups/supabase-backup-${BACKUP_DATE}.sql"

          echo "Starting database dump to ${BACKUP_FILE}..."

          # Try pg_dump first (native PostgreSQL utility)
          if pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges > "$BACKUP_FILE" 2> dump_error.log; then
            echo "pg_dump succeeded!"
          else
            echo "pg_dump failed, checking error log:"
            cat dump_error.log
            echo "Retrying without SSL enforce..."
            if pg_dump "${SUPABASE_DB_URL}?sslmode=require" --no-owner --no-privileges > "$BACKUP_FILE"; then
              echo "pg_dump with sslmode=require succeeded!"
            else
              echo "::error::Failed to export database dump. Please check your SUPABASE_DB_URL connection string secret."
              exit 1
            fi
          fi

          echo "Backup file generated successfully. Size: $(du -h $BACKUP_FILE | cut -f1)"

      - name: Commit and Push Backup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "No new backup changes to commit."
          else
            git commit -m "Automated Nightly DB Backup [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
